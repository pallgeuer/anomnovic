[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomnovic"
version = "1.0.0"
description = "MAE anomaly localization with prompt-free NOVIC object classification"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Philipp Allgeuer"},
  {name = "Jan-Gerrit Habekost"},
]
dependencies = [
  "numpy>=1.24,<2",
  "Pillow>=10,<12",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "timm==0.3.2",
  "opencv-python>=4.8",
  "scikit-learn>=1.3",
  "tensorboard>=2.14",
  "pycocotools>=2.0.7",
]

[project.urls]
Paper = "https://link.springer.com/chapter/10.1007/978-3-032-38401-0_43"
Repository = "https://github.com/pallgeuer/anomnovic"
NOVIC = "https://github.com/pallgeuer/novic"

[project.scripts]
anomnovic-train = "anomnovic.mae.train:cli"
anomnovic-infer = "anomnovic.inference:main"
anomnovic-evaluate = "anomnovic.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
