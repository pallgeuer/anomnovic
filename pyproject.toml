[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomnovic"
version = "1.0.0"
description = "MAE anomaly localization with prompt-free NOVIC object classification"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Philipp Allgeuer"},
  {name = "Jan-Gerrit Habekost"},
]
dependencies = [
  "numpy>=1.24,<2",
  "Pillow>=10,<12",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "timm==0.3.2",
  "opencv-python>=4.8",
  "scikit-learn>=1.3",
  "tensorboard>=2.14",
  "pycocotools>=2.0.7",
]

[project.optional-dependencies]
inference = [
  "torch==2.5.1+cu118",
  "torchvision==0.20.1+cu118",
  "open-clip-torch==2.23.0",
  "optimum==1.17.1",
  "transformers==4.38.2",
  "tqdm==4.70.1",
  "Unidecode==1.4.0",
  "huggingface-hub==0.36.2",
  "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[project.urls]
Paper = "https://link.springer.com/chapter/10.1007/978-3-032-38401-0_43"
Repository = "https://github.com/pallgeuer/anomnovic"
NOVIC = "https://github.com/pallgeuer/novic"

[project.scripts]
anomnovic-train = "anomnovic.mae.train:cli"
anomnovic-infer = "anomnovic.inference:main"
anomnovic-evaluate = "anomnovic.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
